<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><link rel="manifest" href="manifest.webmanifest"><title>JEE Command Centre</title><style>
:root{--bg:#081326;--s:#0e1e38;--s2:#142947;--line:#27466e;--t:#edf5ff;--m:#a9bdd8;--b:#329cff;--c:#35d5e8;--g:#32cf91;--o:#ffb84d;--p:#ad80ff;--r:#ff737d} [data-theme=light]{--bg:#eef4ff;--s:#fff;--s2:#e8f1ff;--line:#c6d9f6;--t:#10264a;--m:#607797;--b:#1769d2;--c:#009db6;--g:#159c69;--o:#bb7800;--p:#7546ce;--r:#d94b5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:var(--s);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 22px}.brand b{display:block;font-size:19px}.muted,small{color:var(--m)}.nav{display:grid;gap:4px}.nav button{border:0;text-align:left;background:none;color:var(--m);padding:10px;border-radius:10px}.nav button.active,.nav button:hover{background:var(--s2);color:var(--t)}.theme{margin-top:20px;width:100%;padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:10px;color:var(--t)}main{padding:22px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:25px}.top p{margin:3px 0;color:var(--m)}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{background:var(--s);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.card h2{font-size:16px;margin:0 0 10px}.metric{font-size:25px;font-weight:750}.tag{font-size:11px;color:var(--m)}.progress{height:8px;background:var(--s2);border-radius:9px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c))}.btn{border:0;background:var(--b);color:white;border-radius:9px;padding:9px 12px}.btn.alt{background:var(--s2);border:1px solid var(--line);color:var(--t)}.field{width:100%;min-width:0;padding:9px;background:var(--bg);color:var(--t);border:1px solid var(--line);border-radius:9px}.form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.form>*{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.topic{display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--m)}.topic input{accent-color:var(--g)}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.notice{background:var(--s2);color:var(--m);padding:10px;border-radius:9px;font-size:12px}.empty{text-align:center;padding:18px;color:var(--m)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--m)}.hero{background:linear-gradient(120deg,var(--s),var(--s2));border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:12px}.chat{height:230px;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:10px;margin:10px 0}.bubble{padding:9px;background:var(--s2);border-radius:10px;margin:6px 0}.mobile{display:none}
@media(max-width:800px){.app{display:block}.side{display:none}main{padding:14px 11px 80px}.span3,.span4,.span6,.span8{grid-column:span 12}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--line);z-index:4;overflow:auto}.mobile button{min-width:62px;border:0;background:none;color:var(--m);font-size:11px;padding:7px}.mobile button.active{color:var(--b)}.mobile span{display:block;font-size:17px}.top h1{font-size:21px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div style="font-size:28px;color:var(--b)">⌁</div><b>JEE Command Centre</b><small>Dream. Prepare. Achieve.</small></div><nav class="nav" id="nav"></nav><button class="theme" id="themeBtn">☾ Light mode</button><p class="muted" style="font-size:11px;margin:20px 8px">Data is saved in this browser. Export backups regularly.</p></aside><main><div class="top"><div><h1 id="title">Home</h1><p id="subtitle">Your preparation, organised.</p></div><small id="today"></small></div>
<section class="page active" id="home"></section><section class="page" id="homework"></section><section class="page" id="mains"></section><section class="page" id="advanced"></section><section class="page" id="super50"></section><section class="page" id="analysis"></section><section class="page" id="mistakes"></section><section class="page" id="revision"></section><section class="page" id="pyq"></section><section class="page" id="focus"></section><section class="page" id="guruji"></section><section class="page" id="analytics"></section><section class="page" id="settings"></section></main></div><nav class="mobile" id="mobile"></nav>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const syllabus={Physics:['Units and Measurements','Kinematics','Laws of Motion','Work, Energy and Power','Rotational Motion','Gravitation','Properties of Solids and Liquids','Thermodynamics','Kinetic Theory of Gases','Oscillations and Waves','Electrostatics','Current Electricity','Magnetic Effects of Current','Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics','Wave Optics','Dual Nature of Matter','Atoms','Nuclei','Semiconductor Electronics'],Chemistry:['Some Basic Concepts of Chemistry','Atomic Structure','Chemical Bonding','Chemical Thermodynamics','Solutions','Equilibrium','Redox Reactions and Electrochemistry','Chemical Kinetics','Periodic Classification','p-Block Elements','d- and f-Block Elements','Coordination Compounds','Purification and Characterisation','GOC','Hydrocarbons','Organic Compounds Containing Halogens','Organic Compounds Containing Oxygen','Organic Compounds Containing Nitrogen','Biomolecules'],Mathematics:['Sets, Relations and Functions','Complex Numbers and Quadratic Equations','Matrices','Determinants','Permutations and Combinations','Binomial Theorem','Sequences and Series','Limits, Continuity and Differentiability','Integral Calculus','Differential Equations','Coordinate Geometry','Three Dimensional Geometry','Vector Algebra','Statistics and Probability','Trigonometry']};
const pages=[['home','⌂','Home'],['homework','☑','Homework'],['mains','▣','JEE Mains'],['advanced','♜','JEE Advanced'],['super50','◎','Super 50'],['analysis','▤','Exam Analysis'],['mistakes','✎','Mistake Book'],['revision','↻','Revision'],['pyq','▧','PYQ Tracker'],['focus','◷','Focus Room'],['guruji','✧','Guruji AI'],['analytics','▥','Analytics'],['settings','⚙','Settings']];
let d=JSON.parse(localStorage.getItem('jeeCC')||'null')||{theme:'dark',dates:{mains:'',advanced:''},syllabus:{},homework:[],daily:{},tests:[],mistakes:[],revisions:[],pyq:{},chat:[]};let current='home';function save(){localStorage.setItem('jeeCC',JSON.stringify(d))}function today(){return new Date().toISOString().slice(0,10)}function left(x){if(!x)return 'Set exam date';let n=Math.ceil((new Date(x+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return n<0?'Date passed':n+' days left'}function count(s){return syllabus[s].filter(t=>d.syllabus[s+'|'+t]).length}function percent(a,b){return b?Math.round(a/b*100):0}function nav(){let h=pages.map(([id,ic,n])=>`<button data-p="${id}" class="${id==='home'?'active':''}"><span style="display:inline-block;width:25px">${ic}</span>${n}</button>`).join('');$('#nav').innerHTML=h;$('#mobile').innerHTML=pages.map(([id,ic,n])=>`<button data-p="${id}" class="${id==='home'?'active':''}"><span>${ic}</span>${n}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p))}function show(id){current=id;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));$('#title').textContent=pages.find(x=>x[0]===id)[2];render(id);scrollTo(0,0)}function subjectCards(){return Object.keys(syllabus).map((s,i)=>`<div class="card span4"><div class="row"><h2>${['⚛','⚗','∑'][i]} ${s}</h2><b>${percent(count(s),syllabus[s].length)}%</b></div><div class="progress"><i style="width:${percent(count(s),syllabus[s].length)}%"></i></div><small>${count(s)}/${syllabus[s].length} chapters done</small>${syllabus[s].map(t=>`<label class="topic"><input type="checkbox" data-topic="${esc(s+'|'+t)}" ${d.syllabus[s+'|'+t]?'checked':''}>${esc(t)}</label>`).join('')}</div>`).join('')}function wire(){document.querySelectorAll('[data-topic]').forEach(x=>x.onchange=()=>{d.syllabus[x.dataset.topic]=x.checked;save();render(current)})}
function render(id){let e=$('#'+id);if(id==='home'){let all=Object.values(syllabus).flat().length,n=Object.keys(syllabus).reduce((a,s)=>a+count(s),0),q=d.daily[today()]||0;e.innerHTML=`<div class="hero"><h2>Good ${new Date().getHours()<12?'Morning':new Date().getHours()<17?'Afternoon':'Evening'}! Keep moving forward.</h2><span class="muted">JEE 2027 • Your personal preparation dashboard</span></div><div class="grid"><div class="card span3"><small>JEE MAIN</small><div class="metric">${left(d.dates.mains)}</div><small>${d.dates.mains||'Exam date not set'}</small></div><div class="card span3"><small>JEE ADVANCED</small><div class="metric">${left(d.dates.advanced)}</div><small>${d.dates.advanced||'Exam date not set'}</small></div><div class="card span3"><small>SYLLABUS</small><div class="metric">${percent(n,all)}%</div><small>${n}/${all} chapters</small></div><div class="card span3"><small>SUPER 50 TODAY</small><div class="metric">${q}/50</div><small>${Math.max(0,50-q)} remaining</small></div><div class="card span12"><div class="row"><h2>PCM Syllabus Overview</h2><button class="btn alt" onclick="show('mains')">Open tracker</button></div><div class="grid">${subjectCards()}</div></div><div class="card span6"><h2>Today's focus</h2><p class="muted">Track assignments, revision and question practice.</p><button class="btn" onclick="show('homework')">Homework</button> <button class="btn alt" onclick="show('super50')">Super 50</button></div><div class="card span6"><h2>Guruji AI</h2><p class="muted">Ask a doubt through ChatGPT handoff or save it for later.</p><button class="btn" onclick="show('guruji')">Ask Guruji</button></div></div>`;wire()}
if(id==='mains'||id==='advanced'){let k=id==='mains'?'mains':'advanced';e.innerHTML=`<div class="hero"><div class="row"><div><h2>JEE ${k==='mains'?'Main':'Advanced'} 2027</h2><div class="metric">${left(d.dates[k])}</div><small>${d.dates[k]||'Set the official exam date in Settings'}</small></div><button class="btn alt" onclick="show('settings')">Set date</button></div></div><div class="card"><h2>PCM Syllabus Tracker</h2><div class="grid">${subjectCards()}</div></div><p class="notice">Starter chapter checklist based on commonly listed JEE topics. Verify against the official 2027 syllabus and your coaching coverage. Progress starts unchecked.</p>`;wire()}
if(id==='homework'){e.innerHTML=`<div class="card"><h2>Add homework</h2><div class="form"><input class="field" id="hw" placeholder="Assignment / DPP name"><select class="field" id="hs"><option>Physics</option><option>Chemistry</option><option>Mathematics</option><option>Other</option></select><input class="field" type="date" id="hd"></div><button class="btn" onclick="addHW()">Add task</button></div><div class="grid"><div class="card span6"><h2>Pending (${d.homework.filter(x=>!x.done).length})</h2>${hwList(false)}</div><div class="card span6"><h2>Done (${d.homework.filter(x=>x.done).length})</h2>${hwList(true)}</div></div>`}
if(id==='super50'){let q=d.daily[today()]||0;e.innerHTML=`<div class="grid"><div class="card span4"><small>TODAY'S PROGRESS</small><div class="metric">${q}/50</div><div class="progress"><i style="width:${Math.min(100,q*2)}%"></i></div><small>${Math.max(0,50-q)} questions to goal</small></div><div class="card span8"><h2>Update today's count</h2><div class="form"><input class="field" id="q" type="number" min="0" max="500" value="${q}"><button class="btn" onclick="setQ()">Save count</button></div><small>Enter total completed today; this replaces the previous count.</small></div><div class="card span12"><h2>Last 7 days</h2><div class="tablewrap"><table><tr><th>Date</th><th>Questions</th><th>Status</th></tr>${Array.from({length:7},(_,i)=>{let x=new Date();x.setDate(x.getDate()-6+i);let k=x.toISOString().slice(0,10),v=d.daily[k]||0;return `<tr><td>${k}</td><td>${v}</td><td>${v>=50?'Goal reached':'In progress'}</td></tr>`}).join('')}</table></div></div></div>`}
if(id==='analysis'){e.innerHTML=`<div class="card"><h2>Add test result</h2><div class="form"><input class="field" id="tn" placeholder="Test name / Allen test ID"><input class="field" id="td" type="date" value="${today()}"><input class="field" id="tm" type="number" placeholder="Maximum marks"></div><div class="form">${['Physics','Chemistry','Mathematics'].map(s=>`<input class="field" id="m${s}" type="number" placeholder="${s} marks">`).join('')}</div><div class="form">${['Correct','Incorrect','Unattempted'].map(s=>`<input class="field" id="s${s}" type="number" placeholder="${s} (optional)">`).join('')}</div><button class="btn" onclick="addTest()">Save result</button><p class="notice">No direct Allen Digital connection is configured. Enter marks manually. Never share your Allen password. Attachments are logged by filename only; this version does not automatically extract marks from PDFs or images.</p><div class="form"><input class="field" type="file" id="rf" accept=".pdf,image/*"><button class="btn alt" onclick="attach()">Log marksheet attachment</button></div><div>${(d.attach||[]).map(x=>`<div class="item">${esc(x.name)} <small>${x.date}</small></div>`).join('')}</div></div><div class="card"><h2>Test history</h2>${d.tests.length?`<div class="tablewrap"><table><tr><th>Test</th><th>Date</th><th>Score</th><th>Physics</th><th>Chemistry</th><th>Maths</th></tr>${d.tests.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.date}</td><td>${t.total}/${t.max} (${percent(t.total,t.max)}%)</td><td>${t.s.Physics}</td><td>${t.s.Chemistry}</td><td>${t.s.Mathematics}</td></tr>`).join('')}</table></div>`:'<div class="empty">No test results yet.</div>'}</div>`}
if(id==='mistakes'){e.innerHTML=`<div class="card"><h2>Log a mistake</h2><div class="form"><input class="field" id="mt" placeholder="Question / concept"><select class="field" id="ms"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select><select class="field" id="mk"><option>Conceptual</option><option>Calculation</option><option>Silly mistake</option><option>Time pressure</option></select></div><textarea class="field" id="mn" placeholder="What went wrong? What is the correct lesson?"></textarea><p><button class="btn" onclick="addMist()">Save mistake</button></p></div><div class="card"><h2>Mistake Book</h2>${d.mistakes.length?d.mistakes.map((x,i)=>`<div class="item"><div><b>${esc(x.title)}</b><small><br>${esc(x.sub)} • ${esc(x.kind)} • ${x.date}<br>${esc(x.note)}</small></div><button class="btn alt" onclick="delMist(${i})">Delete</button></div>`).join(''):'<div class="empty">No mistakes logged.</div>'}</div>`}
if(id==='revision'){e.innerHTML=`<div class="card"><h2>Add revision target</h2><div class="form"><input class="field" id="rt" placeholder="Chapter / topic"><select class="field" id="rs"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select><input class="field" id="rd" type="date"></div><button class="btn" onclick="addRev()">Add revision</button></div><div class="card"><h2>Revision schedule</h2>${d.revisions.length?d.revisions.map((x,i)=>`<div class="item"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleRev(${i},this.checked)"> ${esc(x.topic)} <small>${esc(x.sub)} • ${x.date||'No date'}</small></label><button class="btn alt" onclick="delRev(${i})">Delete</button></div>`).join(''):'<div class="empty">No revision targets yet.</div>'}</div>`}
if(id==='pyq'){e.innerHTML=`<div class="card"><h2>PYQ progress</h2><p class="muted">Record your solved PYQ counts. These are personal totals, not official question counts.</p>${['Physics','Chemistry','Mathematics'].map(s=>`<div class="form"><b>${s}</b><input class="field" id="py${s}" type="number" value="${d.pyq[s]||0}"><button class="btn alt" onclick="savePyq('${s}')">Save</button></div>`).join('')}</div>`}
if(id==='focus'){e.innerHTML=`<div class="card"><h2>Focus timer</h2><div class="metric" id="timer">25:00</div><div class="form"><select class="field" id="fl"><option value="25">25 minutes</option><option value="50">50 minutes</option><option value="90">90 minutes</option></select><button class="btn" onclick="startTimer()">Start</button><button class="btn alt" onclick="stopTimer()">Reset</button></div><small>Timer runs while this page remains open. Completed sessions: ${d.sessions||0}</small></div>`}
if(id==='guruji'){e.innerHTML=`<div class="card"><h2>✧ Guruji — JEE Study Companion</h2><p class="muted">Ask a doubt, request a revision plan or discuss a test. This app hands your prompt to ChatGPT; it is not a separately embedded AI model.</p><div class="chat">${(d.chat||[]).map(x=>`<div class="bubble">${esc(x)}</div>`).join('')||'Try asking for a step-by-step explanation of a JEE concept.'}</div><textarea class="field" id="gp" rows="3" placeholder="Type your doubt or study question..."></textarea><p><button class="btn" onclick="askGuru()">Open in ChatGPT</button> <button class="btn alt" onclick="saveGuru()">Save question</button></p><div class="notice">A true embedded AI chat needs a secure backend and API setup. Never place secret API keys in frontend files.</div></div>`}
if(id==='analytics'){let n=Object.keys(syllabus).reduce((a,s)=>a+count(s),0),b=Object.values(syllabus).flat().length;e.innerHTML=`<div class="grid"><div class="card span3"><small>SYLLABUS</small><div class="metric">${percent(n,b)}%</div><small>${n}/${b} chapters</small></div><div class="card span3"><small>TESTS LOGGED</small><div class="metric">${d.tests.length}</div></div><div class="card span3"><small>QUESTIONS TODAY</small><div class="metric">${d.daily[today()]||0}</div></div><div class="card span3"><small>PYQs LOGGED</small><div class="metric">${Object.values(d.pyq).reduce((a,x)=>a+(+x||0),0)}</div></div><div class="card span12"><h2>Subject completion</h2>${Object.keys(syllabus).map(s=>`<p>${s}: ${count(s)}/${syllabus[s].length} (${percent(count(s),syllabus[s].length)}%)</p><div class="progress"><i style="width:${percent(count(s),syllabus[s].length)}%"></i></div>`).join('')}</div><div class="card span12"><h2>Test score trend</h2>${d.tests.map(x=>`<div class="item">${esc(x.name)} • ${x.date}<b>${x.total}/${x.max} (${percent(x.total,x.max)}%)</b></div>`).join('')||'<div class="empty">Add test results to see trends.</div>'}</div></div>`}
if(id==='settings'){e.innerHTML=`<div class="card"><h2>Exam dates</h2><p class="muted">Enter dates only after checking official announcements.</p><div class="form"><label>JEE Main<input class="field" type="date" id="dm" value="${d.dates.mains}"></label><label>JEE Advanced<input class="field" type="date" id="da" value="${d.dates.advanced}"></label></div><button class="btn" onclick="saveDates()">Save dates</button></div><div class="card"><h2>Backup and restore</h2><p class="muted">Data is stored in this browser on this device only. Clearing site data may erase it.</p><button class="btn" onclick="backup()">Export JSON backup</button> <input class="field" id="restore" type="file" accept=".json"> <button class="btn alt" onclick="restore()">Restore backup</button><p><button class="btn alt" onclick="resetAll()">Reset all data</button></p></div><div class="notice">The chapter checklist is a starter list. Verify it against the official JEE 2027 syllabus and your coaching coverage. No exam dates or marks are pre-filled.</div>`}}
function hwList(done){let a=d.homework.filter(x=>x.done===done);return a.length?a.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small><br>${x.sub} • Due ${x.due||'not set'}</small></div><div><button class="btn alt" onclick="toggleHW(${x.id})">${done?'Undo':'Done'}</button> <button class="btn alt" onclick="delHW(${x.id})">×</button></div></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}function addHW(){let t=$('#hw').value.trim();if(!t)return alert('Enter a task name.');d.homework.push({id:Date.now(),title:t,sub:$('#hs').value,due:$('#hd').value,done:false});save();render('homework')}function toggleHW(id){let x=d.homework.find(x=>x.id===id);x.done=!x.done;save();render('homework')}function delHW(id){d.homework=d.homework.filter(x=>x.id!==id);save();render('homework')}function setQ(){d.daily[today()]=Math.max(0,Math.min(500,+$('#q').value||0));save();render('super50')}
function addTest(){let name=$('#tn').value.trim(),max=+$('#tm').value,s={Physics:+$('#mPhysics').value||0,Chemistry:+$('#mChemistry').value||0,Mathematics:+$('#mMathematics').value||0},total=s.Physics+s.Chemistry+s.Mathematics;if(!name||!max||total>max)return alert('Enter a test name and maximum marks; subject total cannot exceed maximum marks.');d.tests.unshift({name,date:$('#td').value,max,total,s,stats:['Correct','Incorrect','Unattempted'].map(x=>$('#s'+x).value)});save();render('analysis')}function attach(){let f=$('#rf').files[0];if(!f)return alert('Choose a file.');d.attach=d.attach||[];d.attach.push({name:f.name,date:today(),size:f.size});save();render('analysis');alert('Filename logged. Keep the original file; marks are not automatically extracted.')}
function addMist(){let title=$('#mt').value.trim();if(!title)return alert('Enter a concept.');d.mistakes.unshift({title,sub:$('#ms').value,kind:$('#mk').value,note:$('#mn').value,date:today()});save();render('mistakes')}function delMist(i){d.mistakes.splice(i,1);save();render('mistakes')}function addRev(){let topic=$('#rt').value.trim();if(!topic)return alert('Enter a topic.');d.revisions.push({topic,sub:$('#rs').value,date:$('#rd').value,done:false});save();render('revision')}function toggleRev(i,v){d.revisions[i].done=v;save();render('revision')}function delRev(i){d.revisions.splice(i,1);save();render('revision')}function savePyq(s){d.pyq[s]=Math.max(0,+$('#py'+s).value||0);save();alert('Saved.')}
let interval=null,remaining=1500;function startTimer(){stopTimer();remaining=+$('#fl').value*60;interval=setInterval(()=>{remaining--;$('#timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=0){stopTimer();d.sessions=(d.sessions||0)+1;save();alert('Focus session complete.')}},1000)}function stopTimer(){clearInterval(interval);interval=null;remaining=1500;if($('#timer'))$('#timer').textContent='25:00'}function askGuru(){let t=$('#gp').value.trim();if(!t)return;d.chat.push(t);save();window.open('https://chatgpt.com/?q='+encodeURIComponent('Act as my JEE 2027 study mentor. Explain step by step at JEE Main and Advanced level: '+t),'_blank','noopener');render('guruji')}function saveGuru(){let t=$('#gp').value.trim();if(t){d.chat.push(t);save();render('guruji')}}function saveDates(){d.dates.mains=$('#dm').value;d.dates.advanced=$('#da').value;save();alert('Dates saved.')}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='jee-command-centre-backup.json';a.click();URL.revokeObjectURL(u)}function restore(){let f=$('#restore').files[0];if(!f)return alert('Choose a JSON backup.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.dates||!x.syllabus)throw 0;d=x;save();location.reload()}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}function resetAll(){if(confirm('Delete all saved app data? Export a backup first if needed.')){localStorage.removeItem('jeeCC');location.reload()}}
$('#themeBtn').onclick=()=>{d.theme=d.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d.theme;$('#themeBtn').textContent=d.theme==='dark'?'☾ Light mode':'☀ Dark mode';save()};document.documentElement.dataset.theme=d.theme;$('#themeBtn').textContent=d.theme==='dark'?'☾ Light mode':'☀ Dark mode';$('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});nav();render('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
